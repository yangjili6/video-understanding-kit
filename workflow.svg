<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Video Understanding Kit 工作流程</title>
  <desc id="desc">视频经过抽帧、镜头分组和网格生成，产出索引；字幕 OCR 和语音 ASR 可按需启用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8492a6"/>
    </marker>
    <marker id="arrowOpt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d09a36"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324f" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #1c2e45; }
      .sub { font-size: 14px; fill: #63748a; }
      .label { font-size: 17px; font-weight: 700; }
      .detail { font-size: 13px; }
      .edge { fill: none; stroke: #8492a6; stroke-width: 2.5; marker-end: url(#arrow); }
      .optional-edge { fill: none; stroke: #d09a36; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrowOpt); }
    </style>
  </defs>

  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>
  <text x="42" y="48" class="title">从视频到可回查的视觉证据</text>
  <text x="42" y="75" class="sub">主流程生成时间线与网格；字幕识别和语音转写按需开启</text>

  <!-- 主流程连接线 -->
  <path class="edge" d="M180 186H218"/>
  <path class="edge" d="M405 186H458"/>
  <path class="edge" d="M645 186H698"/>
  <path class="edge" d="M875 186H928"/>

  <!-- 主流程节点 -->
  <g filter="url(#shadow)">
    <rect x="35" y="135" width="145" height="102" rx="18" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
    <circle cx="65" cy="166" r="13" fill="#3973c6"/>
    <path d="M61 158L73 166L61 174Z" fill="#fff"/>
    <text x="58" y="201" class="label" fill="#17365d">输入视频</text>
    <text x="58" y="221" class="detail" fill="#45617f">本地文件</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="218" y="135" width="187" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="239" y="174" class="label" fill="#26384e">抽取基础帧</text>
    <text x="239" y="199" class="detail" fill="#63748a">默认 5 fps · 时间戳</text>
    <text x="239" y="219" class="detail" fill="#63748a">保留原始帧以便回查</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="458" y="135" width="187" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="480" y="174" class="label" fill="#26384e">镜头分组</text>
    <text x="480" y="199" class="detail" fill="#63748a">TransNetV2 边界检测</text>
    <text x="480" y="219" class="detail" fill="#63748a">按镜头组织时间线</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="698" y="135" width="177" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="720" y="174" class="label" fill="#26384e">生成网格</text>
    <text x="720" y="199" class="detail" fill="#63748a">每页 6 帧 · 3 × 2</text>
    <text x="720" y="219" class="detail" fill="#63748a">另生成组级导航图</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="928" y="135" width="237" height="102" rx="18" fill="#e6f6ef" stroke="#29966a" stroke-width="2"/>
    <text x="953" y="174" class="label" fill="#124d36">输出与回查</text>
    <text x="953" y="199" class="detail" fill="#39745c">index.json · 网格页</text>
    <text x="953" y="219" class="detail" fill="#39745c">时间戳 · 源帧 ID</text>
  </g>

  <!-- 可选分支 -->
  <text x="42" y="306" font-size="13" font-weight="700" fill="#a87519" letter-spacing=".5">可选分析</text>
  <path class="optional-edge" d="M311 237V340"/>
  <path class="optional-edge" d="M108 237V285H753V340"/>
  <path class="optional-edge" d="M520 391H638"/>
  <path class="optional-edge" d="M858 391H900V270H1046V237"/>

  <g filter="url(#shadow)">
    <rect x="205" y="340" width="315" height="102" rx="18" fill="#fff4df" stroke="#d99b26" stroke-width="1.8"/>
    <text x="231" y="380" class="label" fill="#5c3b00">字幕 OCR · 可选</text>
    <text x="231" y="408" class="detail" fill="#876522">PP-OCRv4 提取字幕候选与疑点标记</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="638" y="340" width="220" height="102" rx="18" fill="#fff4df" stroke="#d99b26" stroke-width="1.8"/>
    <text x="664" y="380" class="label" fill="#5c3b00">语音 ASR · 可选</text>
    <text x="664" y="408" class="detail" fill="#876522">sherpa-onnx 转写候选</text>
  </g>

  <text x="42" y="494" class="sub">OCR 与 ASR 结果是候选；重要内容请回看原帧或音频核验。</text>
</svg>