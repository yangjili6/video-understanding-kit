<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Video Understanding Kit 工作流程</title>
  <desc id="desc">视频经过抽帧、镜头分组、网格生成与两级去重，再贴上字幕条带；硬字幕由读图的模型从条带里读出，落成结构化 JSON 存入阅读库。语音 ASR 可按需启用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8492a6"/>
    </marker>
    <marker id="arrowOpt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d09a36"/>
    </marker>
    <marker id="arrowGrn" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#29966a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324f" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #1c2e45; }
      .sub { font-size: 14px; fill: #63748a; }
      .label { font-size: 16px; font-weight: 700; }
      .detail { font-size: 12.5px; }
      .edge { fill: none; stroke: #8492a6; stroke-width: 2.5; marker-end: url(#arrow); }
      .optional-edge { fill: none; stroke: #d09a36; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrowOpt); }
      .read-edge { fill: none; stroke: #29966a; stroke-width: 2.5; marker-end: url(#arrowGrn); }
    </style>
  </defs>

  <rect width="1400" height="600" rx="24" fill="url(#bg)"/>
  <text x="42" y="46" class="title">从视频到可回查的视觉证据</text>
  <text x="42" y="72" class="sub">主流程生成时间线、网格与字幕条带；语音转写按需开启。不跑 OCR。</text>

  <!-- 主流程连接线 -->
  <path class="edge" d="M186 178H232"/>
  <path class="edge" d="M422 178H468"/>
  <path class="edge" d="M658 178H704"/>
  <path class="edge" d="M894 178H940"/>

  <!-- 主流程节点 -->
  <g filter="url(#shadow)">
    <rect x="45" y="127" width="141" height="102" rx="18" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
    <circle cx="73" cy="158" r="12" fill="#3973c6"/>
    <path d="M69.5 151L80 158L69.5 165Z" fill="#fff"/>
    <text x="66" y="193" class="label" fill="#17365d">输入视频</text>
    <text x="66" y="213" class="detail" fill="#45617f">本地文件 / B 站链接</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="232" y="127" width="190" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="252" y="166" class="label" fill="#26384e">抽取采样帧</text>
    <text x="252" y="190" class="detail" fill="#63748a">按页面预算自动定帧率</text>
    <text x="252" y="210" class="detail" fill="#63748a">保留时间戳与源帧 ID</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="468" y="127" width="190" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="488" y="166" class="label" fill="#26384e">镜头分组</text>
    <text x="488" y="190" class="detail" fill="#63748a">TransNetV2 边界检测</text>
    <text x="488" y="210" class="detail" fill="#63748a">按镜头组织时间线</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="704" y="127" width="190" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="724" y="166" class="label" fill="#26384e">网格 + 两级去重</text>
    <text x="724" y="190" class="detail" fill="#63748a">每页 6 帧 · 3 × 2</text>
    <text x="724" y="210" class="detail" fill="#63748a">帧级 pHash/SSIM → 页级按格</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="127" width="200" height="102" rx="18" fill="#fff" stroke="#8b9aaf" stroke-width="1.6"/>
    <text x="960" y="166" class="label" fill="#26384e">字幕条带</text>
    <text x="960" y="190" class="detail" fill="#63748a">图像差分定位字幕带</text>
    <text x="960" y="210" class="detail" fill="#63748a">切条去重 · 6 格/行</text>
  </g>

  <!-- 第二行：增强页 → VLM → 阅读库 -->
  <path class="read-edge" d="M1018 229V299"/>
  <path class="read-edge" d="M1116 342H1176"/>

  <g filter="url(#shadow)">
    <rect x="920" y="299" width="196" height="86" rx="18" fill="#e6f6ef" stroke="#29966a" stroke-width="2"/>
    <text x="940" y="333" class="label" fill="#124d36">增强页 + JSON</text>
    <text x="940" y="355" class="detail" fill="#39745c">画面与字幕同一张图</text>
    <text x="940" y="373" class="detail" fill="#39745c">网格 / 帧 / 字幕条</text>
  </g>

  <!-- 输出（右下） -->
  <g filter="url(#shadow)">
    <rect x="1176" y="252" width="196" height="134" rx="18" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
    <text x="1196" y="290" class="label" fill="#17365d">输出与回查</text>
    <text x="1196" y="314" class="detail" fill="#45617f">index.json · pages.json</text>
    <text x="1196" y="336" class="detail" fill="#45617f">增强页 · 源帧 ID</text>
    <text x="1196" y="358" class="detail" fill="#45617f">阅读库（最近 3 条）</text>
  </g>

  <!-- 可选分支：ASR -->
  <text x="42" y="322" font-size="13" font-weight="700" fill="#a87519" letter-spacing=".5">可选分析</text>
  <path class="optional-edge" d="M327 229V350"/>
  <path class="optional-edge" d="M470 398H580"/>

  <g filter="url(#shadow)">
    <rect x="232" y="350" width="238" height="98" rx="18" fill="#fff4df" stroke="#d99b26" stroke-width="1.8"/>
    <text x="256" y="390" class="label" fill="#5c3b00">语音 ASR · 可选</text>
    <text x="256" y="415" class="detail" fill="#876522">sherpa-onnx 本地转写</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="580" y="350" width="238" height="98" rx="18" fill="#fff4df" stroke="#d99b26" stroke-width="1.8"/>
    <text x="604" y="390" class="label" fill="#5c3b00">带时间戳的台词</text>
    <text x="604" y="415" class="detail" fill="#876522">与画面按时间轴关联</text>
  </g>

  <text x="42" y="524" class="sub">硬字幕由读图的模型从字幕条带里读出，不是逐像素识别——艺术字、气泡、游戏 UI 也能读对。</text>
  <text x="42" y="550" class="sub">ASR 结果是候选；专名、数字、关键语句仍建议回看原帧或音频。</text>
</svg>
