<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Video Understanding Kit 并行处理流程</title>
  <desc id="desc">输入视频后生成基础帧和帧差。TransNetV2 镜头检测与可选 ASR、软字幕处理并行；结果汇合后补充取帧、预算采样、帧级去重、分组分页，再生成字幕图像条带和页级去重，最后输出索引和页面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18324f" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71839b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3976c5"/></marker>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#168b83"/></marker>
    <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7960b5"/></marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .heading { font-size: 26px; font-weight: 700; fill: #192b42; }
      .subhead { font-size: 14px; fill: #60738d; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
      .node { font-size: 16px; font-weight: 700; fill: #23364d; }
      .detail { font-size: 12.5px; fill: #61748c; }
      .edge { fill: none; stroke: #8292a8; stroke-width: 2.5; marker-end: url(#arrow); }
      .blue { fill: none; stroke: #3976c5; stroke-width: 2.7; marker-end: url(#blueArrow); }
      .teal { fill: none; stroke: #168b83; stroke-width: 2.7; marker-end: url(#tealArrow); }
      .violet { fill: none; stroke: #7960b5; stroke-width: 2.7; marker-end: url(#violetArrow); }
      .optional { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1500" height="850" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="heading">从视频素材到可回查的视觉页面</text>
  <text x="48" y="82" class="subhead">实线表示处理顺序；分叉区展示可并行阶段；虚线表示可选处理。</text>
  <g filter="url(#shadow)"><rect x="560" y="112" width="380" height="76" rx="18" fill="#e8f1ff" stroke="#3976c5" stroke-width="2"/>
    <text x="750" y="143" text-anchor="middle" class="node">输入视频</text><text x="750" y="166" text-anchor="middle" class="detail">本地文件 · 元信息探测 · 基础帧与帧差</text></g>
  <path class="edge" d="M750 188V220H360V249"/><path class="edge" d="M750 220H1140V249"/>
  <rect x="70" y="232" width="660" height="204" rx="22" fill="#edf5ff" stroke="#c6d9f2"/>
  <rect x="770" y="232" width="660" height="204" rx="22" fill="#eff9f7" stroke="#c5e5de"/>
  <text x="100" y="260" class="lane" fill="#3976c5">并行分支 A · 镜头结构</text>
  <text x="800" y="260" class="lane" fill="#168b83">并行分支 B · 语音与字幕</text>
  <g filter="url(#shadow)"><rect x="108" y="286" width="252" height="91" rx="16" fill="#fff" stroke="#8eb3e3" stroke-width="1.5"/>
    <text x="234" y="320" text-anchor="middle" class="node">TransNetV2</text><text x="234" y="344" text-anchor="middle" class="detail">worker 检测镜头边界</text><text x="234" y="363" text-anchor="middle" class="detail">热负载或 --serial 时串行</text></g>
  <g filter="url(#shadow)"><rect x="415" y="286" width="252" height="91" rx="16" fill="#fff" stroke="#8eb3e3" stroke-width="1.5"/>
    <text x="541" y="320" text-anchor="middle" class="node">变化候选与时间轴</text><text x="541" y="345" text-anchor="middle" class="detail">帧差点 · 镜头边界</text></g>
  <path class="blue" d="M360 331H415"/>
  <g filter="url(#shadow)"><rect x="808" y="286" width="252" height="91" rx="16" fill="#fff" stroke="#8bcfc4" stroke-width="1.5"/>
    <text x="934" y="320" text-anchor="middle" class="node">可选：ASR / 候选台词</text><text x="934" y="345" text-anchor="middle" class="detail">本地 sherpa-onnx</text><text x="934" y="363" text-anchor="middle" class="detail">或加载已有候选 cues</text></g>
  <g filter="url(#shadow)"><rect x="1115" y="286" width="252" height="91" rx="16" fill="#fff" stroke="#8bcfc4" stroke-width="1.5"/>
    <text x="1241" y="320" text-anchor="middle" class="node">可选：内嵌软字幕</text><text x="1241" y="345" text-anchor="middle" class="detail">--subs 提取文字字幕轨</text><text x="1241" y="363" text-anchor="middle" class="detail">不执行硬字幕 OCR</text></g>
  <path class="teal optional" d="M1060 331H1115"/>
  <path class="blue" d="M541 377V455H750"/><path class="teal" d="M1241 377V455H750"/>
  <circle cx="750" cy="455" r="7" fill="#5d718a"/><text x="750" y="480" text-anchor="middle" class="detail">分支结果汇合</text>
  <path class="edge" d="M750 487V515"/>
  <g filter="url(#shadow)"><rect x="500" y="515" width="500" height="74" rx="16" fill="#fff" stroke="#a9b5c5" stroke-width="1.5"/>
    <text x="750" y="546" text-anchor="middle" class="node">补充取帧 → 预算采样 → 帧级去重</text><text x="750" y="570" text-anchor="middle" class="detail">按时长分档；镜头与变化候选帮助组织取帧</text></g>
  <path class="edge" d="M750 589V613"/>
  <g filter="url(#shadow)"><rect x="500" y="613" width="500" height="74" rx="16" fill="#fff" stroke="#a9b5c5" stroke-width="1.5"/>
    <text x="750" y="644" text-anchor="middle" class="node">镜头分组 → 六格网格页</text><text x="750" y="668" text-anchor="middle" class="detail">保留帧时间戳、源帧 ID 与格位</text></g>
  <path class="edge" d="M750 687V714H360V738"/><path class="edge" d="M750 714H1140V738"/>
  <g filter="url(#shadow)"><rect x="110" y="738" width="500" height="75" rx="16" fill="#f3efff" stroke="#c9bde9" stroke-width="1.5"/>
    <text x="360" y="769" text-anchor="middle" class="node">字幕带图像条带</text><text x="360" y="793" text-anchor="middle" class="detail">图像差分定位 → 裁切去重 → 贴到增强页</text></g>
  <g filter="url(#shadow)"><rect x="890" y="738" width="500" height="75" rx="16" fill="#fff" stroke="#a9b5c5" stroke-width="1.5"/>
    <text x="1140" y="769" text-anchor="middle" class="node">页级去重</text><text x="1140" y="793" text-anchor="middle" class="detail">整页 / 局部 / 格位覆盖；不确定时保留</text></g>
  <path class="violet" d="M610 776H740V830H750"/><path class="edge" d="M890 776H760V830H750"/>
  <rect x="600" y="817" width="300" height="28" rx="14" fill="#e5edf7"/>
  <text x="750" y="836" text-anchor="middle" class="detail">index.json · pages.json · grids/ · enh-*.jpg</text>
</svg>